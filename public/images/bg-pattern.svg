<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140">
  <defs>
    <style>
      .icon{fill:none;stroke:#0a0a0a;stroke-linecap:round;stroke-linejoin:round;opacity:0.06;}
      .icon-fill{fill:#0a0a0a;opacity:0.06;}
    </style>
  </defs>
  <g transform="rotate(2 100 70)">
    <!-- Controller -->
    <g transform="translate(16 14)" stroke-width="1.6" class="icon">
      <path d="M4 6 C2 6 1 8 1 11 L1 14 C1 18 4 20 8 20 L10 20 L12 16 L20 16 L22 20 L24 20 C28 20 31 18 31 14 L31 11 C31 8 30 6 28 6 Z"/>
      <rect x="9" y="10" width="2" height="6" rx="0.6"/>
      <rect x="7" y="12" width="6" height="2" rx="0.6"/>
      <circle cx="22" cy="9" r="1.1"/>
      <circle cx="25" cy="12" r="1.1"/>
      <circle cx="22" cy="15" r="1.1"/>
      <circle cx="19" cy="12" r="1.1"/>
    </g>
    <!-- Joystick -->
    <g transform="translate(116 10)" stroke-width="1.4" class="icon">
      <rect x="6" y="22" width="20" height="8" rx="2"/>
      <rect x="14" y="9" width="4" height="14"/>
      <circle cx="16" cy="6" r="6"/>
      <circle cx="16" cy="6" r="2.5" class="icon-fill"/>
      <circle cx="10" cy="26" r="1.4"/>
      <circle cx="22" cy="26" r="1.4"/>
    </g>
    <!-- Bolt -->
