      <path d="M16 3 v5 M16 29 v-5 M3 16 h5 M29 16 h-5"/>
      <circle cx="16" cy="16" r="2" class="icon-fill"/>
    </g>
    <!-- Calculator -->
    <g transform="translate(8 92)" stroke-width="1.4" class="icon">
      <rect x="4" y="3" width="24" height="26" rx="2"/>
      <rect x="7" y="6" width="18" height="7" rx="1"/>
      <rect x="7" y="16" width="4" height="3" rx="0.5"/>
      <rect x="14" y="16" width="4" height="3" rx="0.5"/>
      <rect x="21" y="16" width="4" height="3" rx="0.5"/>
      <rect x="7" y="21" width="4" height="3" rx="0.5"/>
      <rect x="14" y="21" width="4" height="3" rx="0.5"/>
      <rect x="21" y="21" width="4" height="3" rx="0.5"/>
